[package]
name = "dart-vm-service"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Async (Tokio) client for the Dart VM Service Protocol: debug, hot reload, profile and monitor Dart/Flutter apps"
readme = "README.md"
repository = "https://github.com/mdddj/dart-vm-service"
license = "MIT OR Apache-2.0"
keywords = ["dart", "flutter", "vm-service", "debugger", "websocket"]
categories = ["development-tools::debugging", "network-programming", "asynchronous"]
include = ["/src", "/examples", "/README.md", "/README.zh-CN.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
